name: Validate website

# The site describes the latest Taksim release. Every build first rewrites release/manifest.json from
# edgeetech/taksim-releases (scripts/release.mjs sync), then the content tests fail if the copy
# references a version, command or client that release does not have. A published release
# triggers validation through repository_dispatch; the schedule is the fallback.
# Production deployment uses local Wrangler; see DEPLOYMENT.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [taksim-release-published]
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    # Windows, so the published taksim.exe can report its own commands and clients when the
    # release does not ship taksim-release-manifest.json.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Read the latest Taksim release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Pull requests keep the committed snapshot when the latest release is not installable yet;
        # every deploying build insists on a complete release.
        run: node scripts/release.mjs sync --walk ${{ github.event_name != 'pull_request' && '--strict' || '' }}
      - name: Upload release manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-manifest
          path: release/manifest.json
          retention-days: 1

  build:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use the release manifest
        uses: actions/download-artifact@v8
        with:
          name: release-manifest
          path: release
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate
        env:
          # Comma-separated GHSA-id:YYYY-MM-DD advisory exceptions, each at most 30 days ahead; see AGENTS.md.
          AUDIT_IGNORE_GHSA: ${{ vars.AUDIT_IGNORE_GHSA }}
        run: |
          jq -r '"Describing Taksim \(.tag) (source: \(.source))"' release/manifest.json
          npm run lint
          npm test
          npm run audit
      - name: Build static site
        run: npm run build
      - name: Upload static artifact
        uses: actions/upload-artifact@v7
        with:
          name: website-static
          path: dist/client
          retention-days: 1
